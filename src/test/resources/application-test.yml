spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

jwt:
  secret:
    key: dGVzdC1zZWNyZXQta2V5LWZvci1zYWdvcGFsZ28tdGVzdC1lbnZpcm9ubWVudC0xMjM0NTY3ODkw
  access-token:
    expiration:
      access-token: 1800000
      refresh-token: 1209600000

portone:
  api-secret: test_api_secret

coolsms:
  api-key: test-key
  api-secret: test-secret
  from: "01000000000"

oauth2:
  redirect-uri: http://localhost:3000/oauth2/callback

logging:
  level:
    root: WARN
    org.example: DEBUG
